name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      # Build locally first and smoke-test startup; only publish if it passes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: stock-alerts:test
          cache-from: type=gha

      - name: Smoke test (starts without Pushover)
        run: |
          COMMON="-e FINNHUB_API_KEY=ci -e SEC_USER_AGENT=ci@example.com -e WATCHLIST=AAPL \
            -e ENABLE_NEWS=false -e ENABLE_PRICES=false -e ENABLE_HALTS=false -e ENABLE_FILINGS=false"
          docker run -d --name smoke $COMMON stock-alerts:test
          sleep 5
          docker logs smoke
          test "$(docker inspect -f '{{.State.Running}}' smoke)" = true
          docker logs smoke 2>&1 | grep -q "Pushover not configured"
          docker rm -f smoke
          # Only one Pushover value set should fail fast with a clear message
          if timeout 20 docker run --rm $COMMON -e PUSHOVER_APP_TOKEN=x stock-alerts:test; then
            echo "expected startup to fail with only one Pushover value"; exit 1
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
