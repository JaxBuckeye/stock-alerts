name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40

      # Shown on the web page under System > Updates
      - name: Version and changelog
        id: ver
        run: |
          git log -30 --date=short --pretty=format:'%h|%ad|%s' > app/CHANGELOG.txt
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      # Build locally first and smoke-test startup; only publish if it passes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: stock-alerts:test
          cache-from: type=gha
          build-args: |
            APP_VERSION=${{ github.sha }}
            BUILD_DATE=${{ steps.ver.outputs.date }}

      - name: Unit tests
        run: |
          docker run --rm -v "$PWD/tests:/srv/tests:ro" -e DATA_DIR=/tmp/testdata \
            -e FINNHUB_API_KEY=ci -e SEC_USER_AGENT=ci@example.com -e WATCHLIST=AAPL \
            -e DISCORD_WEBHOOK_URL=https://example.invalid/hook \
            --entrypoint python stock-alerts:test -m unittest discover -s tests -v

      - name: Smoke test (starts up, web page answers, Discord code loads)
        run: |
          COMMON="-e FINNHUB_API_KEY=ci -e SEC_USER_AGENT=ci@example.com -e WATCHLIST=AAPL -e DRY_RUN=true \
            -e ENABLE_NEWS=false -e ENABLE_PRICES=false -e ENABLE_HALTS=false -e ENABLE_FILINGS=false \
            -e ENABLE_EARNINGS=false -e ENABLE_SITES=false -e ENABLE_CVR=false"
          # Starts and stays up with only a Discord webhook (no Pushover); web page on 8080
          docker run -d --name smoke -p 8080:8080 $COMMON -e DISCORD_WEBHOOK_URL=https://example.invalid/hook stock-alerts:test
          sleep 6
          docker logs smoke
          test "$(docker inspect -f '{{.State.Running}}' smoke)" = true
          docker logs smoke 2>&1 | grep -q "pushover=False discord=True"
          docker logs smoke 2>&1 | grep -q "First-time setup: open http://<this-server>:8080 and enter setup code"
          curl -fsS http://localhost:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 302   # -> /setup
          curl -fsS http://localhost:8080/setup | grep -q "Create your login"
          docker rm -f smoke
          # Discord bot module and discord.py import cleanly
          docker run --rm $COMMON -e DISCORD_WEBHOOK_URL=https://example.invalid/hook \
            --entrypoint python stock-alerts:test -c "import app.bot; print('bot import ok')"
          # No alert channel: stays up so the web page can fix it, alerts paused
          docker run -d --name nochan $COMMON stock-alerts:test
          sleep 5
          docker logs nochan
          test "$(docker inspect -f '{{.State.Running}}' nochan)" = true
          docker logs nochan 2>&1 | grep -q "Setup needed: No alert channel set up"
          docker rm -f nochan

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            BUILD_DATE=${{ steps.ver.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
