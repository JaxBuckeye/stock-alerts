<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Three wizards casting a money spell">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d1f57"/>
      <stop offset="1" stop-color="#110c22"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset=".55" stop-color="#f5b83d"/>
      <stop offset="1" stop-color="#d48a12"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd76a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tip">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#8be9ff"/>
      <stop offset="1" stop-color="#8be9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- rising market line -->
  <polyline points="8,104 30,90 46,96 66,74 84,80 104,56 120,48" fill="none" stroke="#2ecc8f" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" opacity=".35"/>

  <!-- spells streaming from the staffs into the coin -->
  <g fill="none" stroke-linecap="round">
    <path d="M19 58 Q24 26 50 26" stroke="#8be9ff" stroke-width="2.4" stroke-dasharray="1 4.5"/>
    <path d="M109 58 Q104 26 78 26" stroke="#8be9ff" stroke-width="2.4" stroke-dasharray="1 4.5"/>
    <path d="M81 49 Q80 42 74 38" stroke="#ffe08a" stroke-width="2.4" stroke-dasharray="1 4"/>
  </g>

  <!-- the coin -->
  <circle cx="64" cy="26" r="25" fill="url(#glow)"/>
  <circle cx="64" cy="26" r="15" fill="url(#coin)" stroke="#a86b08" stroke-width="2"/>
  <circle cx="64" cy="26" r="11" fill="none" stroke="#a86b08" stroke-width="1.2" opacity=".55"/>
  <text x="64" y="32.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="18" fill="#6b4300">$</text>

  <!-- sparkles -->
  <g fill="#ffe9a8">
    <path d="M38 12 L39.2 15.8 L43 17 L39.2 18.2 L38 22 L36.8 18.2 L33 17 L36.8 15.8 Z"/>
    <path d="M94 9 L94.9 11.9 L97.8 12.8 L94.9 13.7 L94 16.6 L93.1 13.7 L90.2 12.8 L93.1 11.9 Z"/>
    <path d="M100 36 L100.7 38.3 L103 39 L100.7 39.7 L100 42 L99.3 39.7 L97 39 L99.3 38.3 Z"/>
    <path d="M27 36 L27.7 38.3 L30 39 L27.7 39.7 L27 42 L26.3 39.7 L24 39 L26.3 38.3 Z"/>
  </g>

  <!-- left wizard (purple) -->
  <line x1="15" y1="124" x2="19" y2="60" stroke="#a9805a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="19" cy="58" r="6" fill="url(#tip)"/>
  <path d="M13 124 L21 92 L39 92 L47 124 Z" fill="#4b36b3"/>
  <circle cx="30" cy="86" r="6.5" fill="#f3c9a1"/>
  <path d="M23 88 Q30 109 37 88 Z" fill="#eef2ff"/>
  <ellipse cx="30" cy="80" rx="14" ry="3.6" fill="#7c5cff"/>
  <path d="M20 80 L29 56 Q32 49 41 51 Q34 55 33 58 L40 80 Z" fill="#7c5cff"/>
  <path d="M31 66 L31.8 68.4 L34.2 69.2 L31.8 70 L31 72.4 L30.2 70 L27.8 69.2 L30.2 68.4 Z" fill="#ffe08a"/>

  <!-- right wizard (blue) -->
  <line x1="113" y1="124" x2="109" y2="60" stroke="#a9805a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="109" cy="58" r="6" fill="url(#tip)"/>
  <path d="M81 124 L89 92 L107 92 L115 124 Z" fill="#1f6fa8"/>
  <circle cx="98" cy="86" r="6.5" fill="#f3c9a1"/>
  <path d="M91 88 Q98 109 105 88 Z" fill="#eef2ff"/>
  <ellipse cx="98" cy="80" rx="14" ry="3.6" fill="#3fb6ff"/>
  <path d="M88 80 L97 56 Q94 49 85 51 Q92 55 95 58 L108 80 Z" fill="#3fb6ff"/>
  <path d="M97 66 L97.8 68.4 L100.2 69.2 L97.8 70 L97 72.4 L96.2 70 L93.8 69.2 L96.2 68.4 Z" fill="#ffe08a"/>

  <!-- middle wizard (gold-trimmed red), standing in front -->
  <g transform="translate(0,-2)">
    <line x1="80" y1="122" x2="81" y2="54" stroke="#a9805a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="81" cy="51" r="6.5" fill="url(#tip)"/>
    <path d="M45 126 L54 90 L74 90 L83 126 Z" fill="#a3305a"/>
    <path d="M58 126 L64 98 L70 126 Z" fill="#f5b83d" opacity=".85"/>
    <circle cx="64" cy="84" r="7" fill="#f3c9a1"/>
    <path d="M56 86 Q64 110 72 86 Z" fill="#eef2ff"/>
    <ellipse cx="64" cy="77" rx="15.5" ry="4" fill="#ff5f87"/>
    <path d="M53 77 L63 50 Q66 43 76 46 Q68 49 67 52 L75 77 Z" fill="#ff5f87"/>
    <rect x="53" y="72" width="22" height="4" rx="1.5" fill="#f5b83d"/>
    <path d="M65 59 L66 62 L69 63 L66 64 L65 67 L64 64 L61 63 L64 62 Z" fill="#ffe08a"/>
  </g>
</svg>
