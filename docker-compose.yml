services:
  stock-alerts:
    # Built by GitHub Actions on every push to main (.github/workflows/docker.yml).
    # Update with: docker compose pull && docker compose up -d
    image: ghcr.io/jaxbuckeye/stock-alerts:latest
    pull_policy: always
    container_name: stock-alerts
    restart: unless-stopped
    env_file: .env
    volumes:
      - alerts-data:/data

volumes:
  alerts-data:
