services:
  stock-alerts:
    # Built by GitHub Actions on every push to main (.github/workflows/docker.yml).
    # Update with: docker compose pull && docker compose up -d
    image: ghcr.io/jaxbuckeye/stock-alerts:latest
    pull_policy: always
    container_name: stock-alerts
    restart: unless-stopped
    # Settings can live on the web page instead; .env is optional once they're copied there.
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"   # settings web page: http://<server>:8080
    volumes:
      - alerts-data:/data

volumes:
  alerts-data:
